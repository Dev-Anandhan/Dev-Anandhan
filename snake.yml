# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  SNAKE CONTRIBUTION ANIMATION — GitHub Actions Workflow
#  Save this file to: .github/workflows/snake.yml
#  in your profile repo (YOUR_USERNAME/YOUR_USERNAME)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Generate Snake

on:
  # Runs automatically every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Lets you trigger it manually from the Actions tab
  workflow_dispatch:

  # Also runs on every push to main (optional — remove if noisy)
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate contribution snake SVG
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push to the output branch

    steps:
      # Step 1 — Generate both light and dark SVGs
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2 — Push the generated SVGs to the "output" branch
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: regenerate contribution snake [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
